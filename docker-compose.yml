services:
  aristo-db:
    image: neo4j:5
    container_name: aristo-db
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-password}
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - aruism_net
  aristo-engine:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: aristo-engine
    hostname: aristo-engine
    
    # GPU設定
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 2  # RTX 5090 2枚
              capabilities: [gpu]
    
    # IPC設定（GPU間通信用）
    ipc: host
    shm_size: '128gb'
    
    # セキュリティ設定
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_PTRACE
      - SYS_NICE
    
    # 環境変数
    environment:
      # GPU設定
      - CUDA_VISIBLE_DEVICES=0,1
      - NVIDIA_VISIBLE_DEVICES=0,1
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - TORCH_CUDA_ARCH_LIST="8.9;9.0"  # 修正: RTX 5090用に調整
      
      # NCCL設定（GPU間通信）
      - NCCL_DEBUG=INFO
      - NCCL_P2P_LEVEL=NVL
      - NCCL_TREE_THRESHOLD=0
      - NCCL_IB_DISABLE=1
      
      # PyTorch設定
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512
      - CUDA_LAUNCH_BLOCKING=0
      - TORCH_NCCL_BLOCKING_WAIT=1
      - TORCH_DISTRIBUTED_DEBUG=DETAIL
      
      # その他
      - OMP_NUM_THREADS=32
      - MKL_NUM_THREADS=32
    
    # ボリュームマウント
    volumes:
      - /home/takasan/Aruism-AI-Local/docker/engine:/workspace/engine:ro
      - /home/takasan/Aruism-AI-Local/scripts:/workspace/scripts2:rw
      - /home/takasan/Aruism-AI-Local/prompts:/workspace/prompts:rw
      - /home/takasan/Aruism-AI-Local/AIgenerated:/workspace/AIgenerated:rw
    # 作業ディレクトリ
    working_dir: /workspace
    
    # TTYとSTDIN
    tty: true
    stdin_open: true
    
    # ヘルスチェック
    healthcheck:
      test: ["CMD", "nvidia-smi"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # リソース制限
    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack:
        soft: 67108864
        hard: 67108864
    
    # コマンド
    command: /bin/bash
    
    # 再起動ポリシー
    restart: unless-stopped
    
    # ネットワーク設定
    networks:
      - aruism_net
    
    # aristo-dbへの依存関係を追加
    depends_on:
      - aristo-db

# ボリューム定義セクション
volumes:
  neo4j_data:
    driver: local

# ネットワーク定義セクション
networks:
  aruism_net:
    driver: bridge