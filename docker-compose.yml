version: '3.9'
services:
  aristo-db:
    image: neo4j:5
    container_name: aristo-db       #- 修正: "aris-db" から "aristo-db" へ
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data # 【追加】データベースのデータを永続化
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-password} # <- 正しい形式に修正
    healthcheck: # 【追加】DBが完全に起動するまで待機する設定
      test: ["CMD-SHELL", "wget --spider -q http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:                         #- 追加: サービスを共通ネットワークに参加させる
      - aruism_net

  aristo-engine:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: aristo-engine
    networks:
      - aruism_net
    environment:
      - LLAMA_ARG_MODEL=/models/Llama-4-Scout-Q8-merged.gguf
      - LLAMA_ARG_CTX_SIZE=8192
      - LLAMA_ARG_N_GPU_LAYERS=24
      - LLAMA_ARG_HOST=0.0.0.0
      - LLAMA_ARG_PORT=8080
      - LLAMA_ARG_N_THREADS=24
      - LLAMA_ARG_TENSOR_SPLIT=1,1
      - LLAMA_ARG_BATCH=512
      - LLAMA_ARG_UBATCH=256
      - GGML_CUDA_NO_PINNED=1
    volumes:
      - ./workspace/llama.cpp/models:/models
    ports:
      - "8080:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ipc: host # 【追加】ホストのネットワークを使用する設定
    ulimits:
      memlock: -1 # 【追加】メモリロックの制限を解除
      stack: 67108864 # 【追加】スタックサイズの制限を設定

  aristo-engine-q6:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: aristo-engine-q6
    environment:
      - LLAMA_ARG_MODEL=/models/Llama-4-Scout-17B-16E-Instruct-Q6_K-00001-of-00003.gguf
      - LLAMA_ARG_CTX_SIZE=8192
      - LLAMA_ARG_MODEL_TYPE=Q6_K  # Q6用のモデルタイプ
      - LLAMA_ARG_N_GPU_LAYERS=32  # Q6用に調整
      - LLAMA_ARG_HOST=0.0.0.0
      - LLAMA_ARG_PORT=8081  # ポートを変更
      - LLAMA_ARG_N_THREADS=24
      - LLAMA_ARG_BATCH=4096
      - LLAMA_ARG_UBATCH=1024
      - GGML_CUDA_NO_PINNED=0
      - LLAMA_ARG_TENSOR_SPLIT=1,1.1
      - LLAMA_ARG_SPECIAL=1
    volumes:
      - /home/takasan/Aruism-AI-Local/models:/models:ro  # 絶対パスに変更
    ports:
      - "8081:8081"  # 別のポートを使用
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - aruism_net
    ipc: host # 【追加】ホストのネットワークを使用する設定



  aristo-app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: aristo-app
    tty: true
    stdin_open: true
    volumes:
      - .:/workspace/Aruism-AI-Local
    environment:
      - NEO4J_URI=bolt://aristo-db:7687
      - NEO4J_USER=neo4j
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-password} # <- 正しい形式に修正
    env_file:
      - .env # 【追加】環境変数ファイルを読み込む
    depends_on:
      - aristo-db
    networks:
      - aruism_net
# ボリューム定義セクション
volumes:
  neo4j_data:
    driver: local

# ネットワーク定義セクション
networks:
  aruism_net:
    driver: bridge