services:
  arism-db:
    image: neo4j:5
    container_name: arism-db
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password

# docker-compose.yml

# ... (version, services, arism-db の定義は変更なし) ...

# docker-compose.yml (aristo-engine部分)

  aristo-engine:
    # 以前ビルドに成功した、実績のあるイメージを使用
    image: nvidia/cuda:12.5.1-devel-ubuntu22.04
    container_name: aristo-engine
    # 思考エンジンをサーバーモードで起動するための、最終的なコマンド
    command:
      - "/workspace/llama.cpp/build/bin/llama-server"
      - "-m"
      - "/workspace/llama.cpp/models/Llama-4-Scout-Q8-merged.gguf"
      - "-c"
      - "8192"
      - "-ngl"
      - "24"  # 最初の24レイヤーをGPU 0に
      - "-ngl"
      - "24"  # 次の24レイヤーをGPU 1に (合計48レイヤー)
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
    ports:
      - "8080:8080"
    # マルチGPU通信と安定稼働に必須のオプション
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    # ビルド済みのエンジンと、ダウンロード済みのモデルを永続化
    volumes:
      - ./workspace:/workspace
  # ... (arism-app, volumes の定義は変更なし) ...
  arism-app:
    image: python:3.10
    container_name: arism-app
    command: bash -c "pip install neo4j && tail -f /dev/null"
    volumes:
      - .:/workspace/Aruism-AI-Local
    environment:
      - NEO4J_URI=bolt://arism-db:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password