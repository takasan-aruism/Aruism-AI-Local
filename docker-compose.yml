version: '3.9'
services:
  aristo-db:
    image: neo4j:5
    container_name: aris-db
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password

  aristo-engine:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: aristo-engine
    environment:
      - LLAMA_ARG_MODEL=/models/Llama-4-Scout-Q8-merged.gguf
      - LLAMA_ARG_CTX_SIZE=4096
      - LLAMA_ARG_N_GPU_LAYERS=25
      - LLAMA_ARG_HOST=0.0.0.0
      - LLAMA_ARG_PORT=8080
      - LLAMA_ARG_N_THREADS=24
      - LLAMA_ARG_TENSOR_SPLIT=1,1
      - LLAMA_ARG_BATCH=2048
      - LLAMA_ARG_UBATCH=1024

      - GGML_CUDA_NO_PINNED=1
    volumes:
      - ./workspace/llama.cpp/models:/models
    ports:
      - "8080:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  aristo-app:
    image: python:3.10
    container_name: aristo-app
    command: bash -c "pip install neo4j && tail -f /dev/null"
    volumes:
      - .:/workspace/Aruism-AI-Local
    environment:
      - NEO4J_URI=bolt://aristo-db:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password