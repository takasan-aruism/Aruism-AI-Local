# docker-compose.yml

services:
  # --- 知識データベース・サービス ---
  arism-db:
    image: neo4j:5
    container_name: arism-db
    ports:
      - "7474:7474"  # Web UI
      - "7687:7687"  # Bolt protocol
    volumes:
      - neo4j_data:/data
      - ./conf:/conf # 設定ファイル用
      - ./plugins:/plugins # プラグイン用
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD} # .envファイルから読み込む
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes # Community版では不要だが念のため
      - NEO4J_PLUGINS=["apoc", "graph-data-science"] # APOC等のプラグインを有効化

  # --- 思考エンジン・サービス ---
  aristo-engine:
    build:
      context: .
      dockerfile: Dockerfile.engine
    container_name: aristo-engine
    ports:
      - "8080:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    volumes:
      - ./models:/workspace/llama.cpp/models # GGUFモデルファイルをマウント

  # --- アリズム開発・実行サービス ---
  arism-app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: arism-app
    tty: true
    stdin_open: true
    environment:
      - NEO4J_URI=bolt://arism-db:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD} # .envファイルから読み込む
      - LLAMA_API_URL=http://aristo-engine:8080
    volumes:
      - ./Aruism-AI-Local:/workspace/Aruism-AI-Local
    depends_on:
      - arism-db
      - aristo-engine

volumes:
  neo4j_data: